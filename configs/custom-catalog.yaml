name: h9s-catalog
displayName: h9s General-Purpose Catalog
registry:
  redis:
    description: Redis database operations - key/value, hashes, lists, sets, sorted sets, streams, pub/sub, and vector search
    title: Redis
    type: server
    image: mcp/redis@sha256:c9162917b62dda5495feb9a2ca277564269cf2bfbe6d468b851a9dcb6c88d686
    tools:
      - name: get
      - name: set
      - name: delete
      - name: expire
      - name: scan_keys
      - name: hget
      - name: hgetall
      - name: hset
      - name: hdel
      - name: lpush
      - name: rpush
      - name: lpop
      - name: rpop
      - name: lrange
      - name: llen
      - name: sadd
      - name: smembers
      - name: srem
      - name: zadd
      - name: zrange
      - name: zrem
      - name: xadd
      - name: xrange
      - name: xdel
      - name: publish
      - name: subscribe
      - name: unsubscribe
      - name: json_get
      - name: json_set
      - name: json_del
      - name: info
      - name: dbsize
      - name: type
      - name: rename
      - name: scan_all_keys
      - name: search_redis_documents
      - name: client_list
    secrets:
      - name: redis.password
        env: REDIS_PWD
        example: ""
    env:
      - name: REDIS_HOST
        value: "{{redis.host}}"
      - name: REDIS_PORT
        value: "{{redis.port}}"
      - name: REDIS_USERNAME
        value: "{{redis.username}}"
      - name: REDIS_PWD
        value: "{{redis.password}}"
      - name: REDIS_SSL
        value: "{{redis.ssl}}"

  context7:
    description: Up-to-date code documentation for LLMs and AI code editors
    title: Context7
    type: server
    image: mcp/context7@sha256:1174e6a29634a83b2be93ac1fefabf63265f498c02c72201fe3464e687dd8836
    tools:
      - name: resolve-library-id
      - name: get-library-docs
    env:
      - name: MCP_TRANSPORT
        value: stdio

  github:
    description: GitHub API interaction - issues, pull requests, repositories, and code search
    title: GitHub
    type: server
    image: mcp/github@sha256:89fd71b6f2dd098de0d7517c1899b7fe90590d3193e253991d61a800b041bfd4
    tools:
      - name: search_repositories
      - name: search_code
      - name: search_issues
      - name: search_users
      - name: list_issues
      - name: get_issue
      - name: create_issue
      - name: update_issue
      - name: add_issue_comment
      - name: list_pull_requests
      - name: get_pull_request
      - name: get_pull_request_comments
      - name: get_pull_request_files
      - name: get_pull_request_reviews
      - name: get_pull_request_status
      - name: create_pull_request
      - name: create_pull_request_review
      - name: merge_pull_request
      - name: update_pull_request_branch
      - name: create_branch
      - name: get_file_contents
      - name: create_or_update_file
      - name: push_files
      - name: list_commits
      - name: create_repository
      - name: fork_repository
    secrets:
      - name: github.personal_access_token
        env: GITHUB_PERSONAL_ACCESS_TOKEN
        example: <YOUR_TOKEN>
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        value: "{{github.personal_access_token}}"

  markitdown:
    description: Convert PDF, DOCX, PPTX, XLSX, HTML, audio, and YouTube to markdown
    title: Markitdown
    type: server
    image: mcp/markitdown@sha256:a93f01634ef919fae708b3c173f88785e6c586d9e485fef0a2bb15363f29cc1d
    tools:
      - name: convert_to_markdown
    volumes:
      - '{{markitdown.paths|volume|into}}'
    config:
      - name: markitdown
        description: The MCP server is allowed to access these paths
        type: object
        properties:
          paths:
            type: array
            items:
              type: string
        required:
          - paths

  falkordb:
    description: FalkorDB graph database — execute OpenCypher queries, manage nodes and relationships, vector search
    title: FalkorDB
    type: server
    image: falkordb/mcpserver:latest
    tools:
      - name: query_graph
      - name: query_graph_readonly
    env:
      - name: FALKORDB_HOST
        value: "falkordb-h9s"
      - name: FALKORDB_PORT
        value: "6379"
      - name: MCP_TRANSPORT
        value: stdio

  h9s-ingest:
    description: Document ingestion and semantic search — chunk markdown, embed, store and query vectors in FalkorDB
    title: h9s Ingest
    type: server
    image: h9s-ingest:latest
    tools:
      - name: ingest_documents
      - name: search_documents
    env:
      - name: FALKOR_ADDR
        value: "falkordb-h9s:6379"
      - name: EMBEDDING_URL
        value: "http://host.docker.internal:8090"
