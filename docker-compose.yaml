services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-h9s
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - falkor_data:/data
    networks:
      - h9s-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: h9s-ingest
    restart: unless-stopped
    environment:
      - FALKOR_ADDR=falkordb:6379
      - EMBEDDING_URL=http://host.docker.internal:8090
      - H9S_TRANSPORT=http
      - H9S_PORT=8091
    ports:
      - "8091:8091"
    networks:
      - h9s-network
    depends_on:
      falkordb:
        condition: service_healthy

  mcp-gateway:
    image: docker/mcp-gateway
    restart: unless-stopped
    command:
      - --enable-all-servers
      - --config=/mcp/config.yaml
      - --catalog=/mcp/custom-catalog.yaml
      - --transport=streaming
      - --port=8812
      - --verbose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/mcp-config.yaml:/mcp/config.yaml:ro
      - ./configs/custom-catalog.yaml:/mcp/custom-catalog.yaml:ro
    ports:
      - "8812:8812"
    networks:
      - h9s-network
    depends_on:
      falkordb:
        condition: service_healthy

networks:
  h9s-network:
    driver: bridge

volumes:
  falkor_data:
